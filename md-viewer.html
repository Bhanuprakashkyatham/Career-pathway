<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer - Job Application System</title>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #667eea;
            font-size: 1.8em;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.2s ease;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
        }

        .file-selector {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .file-selector label {
            font-weight: bold;
            color: #333;
            margin-right: 10px;
        }

        .file-selector select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 1em;
            min-width: 300px;
            cursor: pointer;
        }

        .content-wrapper {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            min-height: 500px;
        }

        #markdown-content {
            line-height: 1.8;
            color: #333;
        }

        #markdown-content h1 {
            color: #667eea;
            margin: 30px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            font-size: 2.2em;
        }

        #markdown-content h2 {
            color: #764ba2;
            margin: 25px 0 15px 0;
            font-size: 1.8em;
        }

        #markdown-content h3 {
            color: #667eea;
            margin: 20px 0 12px 0;
            font-size: 1.4em;
        }

        #markdown-content h4 {
            color: #333;
            margin: 15px 0 10px 0;
            font-size: 1.2em;
        }

        #markdown-content p {
            margin: 15px 0;
            font-size: 1.05em;
        }

        #markdown-content ul, #markdown-content ol {
            margin: 15px 0;
            padding-left: 30px;
        }

        #markdown-content li {
            margin: 8px 0;
            line-height: 1.6;
        }

        #markdown-content code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #e83e8c;
            font-size: 0.95em;
        }

        #markdown-content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
        }

        #markdown-content pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        #markdown-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 20px;
            margin: 20px 0;
            color: #666;
            font-style: italic;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
        }

        #markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        #markdown-content table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
        }

        #markdown-content table td {
            padding: 10px 12px;
            border: 1px solid #ddd;
        }

        #markdown-content table tr:nth-child(even) {
            background: #f8f9fa;
        }

        #markdown-content hr {
            border: none;
            border-top: 2px solid #e0e0e0;
            margin: 30px 0;
        }

        #markdown-content a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        #markdown-content a:hover {
            text-decoration: underline;
        }

        #markdown-content strong {
            color: #667eea;
            font-weight: 600;
        }

        #markdown-content em {
            color: #764ba2;
        }

        .emoji {
            font-size: 1.2em;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: #ffe0e0;
            border-left: 4px solid #f44336;
            padding: 20px;
            border-radius: 8px;
            color: #c62828;
        }

        /* Checkbox styling */
        #markdown-content input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.2);
        }

        /* Badge styling for special sections */
        #markdown-content .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .file-selector select {
                min-width: 100%;
            }

            .content-wrapper {
                padding: 20px;
            }

            #markdown-content h1 {
                font-size: 1.8em;
            }

            #markdown-content h2 {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Document Viewer</h1>
            <div class="nav-buttons">
                <a href="index.html" class="btn">🏠 Dashboard</a>
                <a href="learning-tracker.html" class="btn btn-secondary">📊 Tracker</a>
            </div>
        </div>

        <div class="file-selector">
            <label for="file-select">📁 Select Document:</label>
            <select id="file-select" onchange="loadMarkdown()">
                <option value="">-- Choose a document --</option>
                <optgroup label="📋 System Overview">
                    <option value="SYSTEM-OVERVIEW.md">🚀 COMPLETE SYSTEM OVERVIEW (START HERE!)</option>
                </optgroup>
                <optgroup label="🚀 Start Here">
                    <option value="START-HERE-ACTION-PLAN.md">START HERE - Action Plan</option>
                    <option value="FINAL-SYNOPSIS.md">Final Synopsis</option>
                    <option value="claude.md">Master Reference (CLAUDE.md)</option>
                </optgroup>
                <optgroup label="📄 Resume & Introduction">
                    <option value="Resume_Optimized_Bhanu_Prakash.md">Optimized Resume</option>
                    <option value="self-introduction.md">Self Introduction</option>
                </optgroup>
                <optgroup label="📊 Application Strategy">
                    <option value="daily-application-strategy.md">Daily Application Strategy</option>
                    <option value="job-tracker.md">Job Tracker</option>
                </optgroup>
                <optgroup label="🎓 Learning Roadmaps">
                    <option value="java-vs-nodejs-analysis.md">Java vs Node.js Analysis</option>
                    <option value="backend-interview-syllabus.md">Backend Interview Syllabus</option>
                    <option value="2-month-daily-roadmap.md">2-Month Daily Roadmap</option>
                    <option value="dsa-strategy-paper-coding.md">DSA & Paper Coding Strategy</option>
                </optgroup>
                <optgroup label="🎯 Interview & Profile">
                    <option value="interview-preparation.md">Interview Preparation</option>
                    <option value="linkedin-naukri-optimization.md">LinkedIn & Naukri Optimization</option>
                </optgroup>
                <optgroup label="🔮 Future Learning">
                    <option value="ai-deployment-future-learning.md">AI/RAG & Deployment Path</option>
                </optgroup>
                <optgroup label="⏱️ Time Tracking">
                    <option value="TIME-TRACKER-GUIDE.md">Time Tracker - Complete Guide</option>
                </optgroup>
                <optgroup label="🎓 Learning Hub">
                    <option value="LEARNING-HUB-GUIDE.md">Learning Hub - Complete Guide</option>
                    <option value="FIREBASE-SETUP-GUIDE.md">🔥 Firebase Setup Guide (Optional)</option>
                </optgroup>
            </select>
        </div>

        <div class="content-wrapper">
            <div id="markdown-content" class="loading">
                👆 Select a document from the dropdown above to view it
            </div>
        </div>
    </div>

    <script>
        // Configure marked options
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // Load markdown file
        async function loadMarkdown() {
            const select = document.getElementById('file-select');
            const fileName = select.value;
            const contentDiv = document.getElementById('markdown-content');

            if (!fileName) {
                contentDiv.innerHTML = '<div class="loading">👆 Select a document from the dropdown above to view it</div>';
                return;
            }

            contentDiv.innerHTML = '<div class="loading">⏳ Loading document...</div>';

            try {
                const response = await fetch(fileName);

                if (!response.ok) {
                    throw new Error('File not found');
                }

                const markdown = await response.text();
                const html = marked.parse(markdown);

                contentDiv.innerHTML = html;

                // Apply syntax highlighting to code blocks
                contentDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });

                // Scroll to top
                window.scrollTo(0, 0);

            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error Loading Document</h3>
                        <p>Could not load "${fileName}". Please make sure the file exists in the same directory.</p>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        // Check for file parameter in URL
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');

            if (file) {
                document.getElementById('file-select').value = file;
                loadMarkdown();
            }
        });
    </script>
</body>
</html>
